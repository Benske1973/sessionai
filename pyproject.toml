[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "session-ai-forecaster"
version = "0.1.0"
description = "Per-coin session research and forecasting foundation"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2,<3",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
parquet = ["pyarrow>=17,<22"]

[project.scripts]
session-ai = "session_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
